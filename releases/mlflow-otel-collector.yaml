# Bridges otel-demo's and kagent's OTel traces into MLflow Tracing.
# MLflow's tracking server only accepts OTLP/HTTP at POST /v1/traces --
# gRPC ingestion isn't implemented. This collector receives gRPC on :4317
# and re-exports over OTLP/HTTP with the x-mlflow-experiment-id header
# MLflow requires to route spans into an experiment.
#
# One shared receiver, split into each source's own experiment by the
# routing connector. Deliberately no default_pipelines/catch-all bucket:
# an unrouted span surfaces as a "dropped" debug log, not silently joins
# a wrong experiment.
#
# Sources:
# - otel-demo: matched on k8s.namespace.name == "otel-demo". Its own
#   collector (releases/opentelemetry-demo.yaml) injects k8s_attributes
#   before forwarding here.
# - kagent: matched on k8s.namespace.name == "kagent". kagent's OTLP
#   exporter sends directly to this collector (see releases/kagent.yaml
#   otel.tracing.exporter.otlp.endpoint).
#
# Experiment IDs are assigned by mlflow at creation time, not deterministic.
# Created once via POST /api/2.0/mlflow/experiments/create:
#   name: "otel-demo" -> "1", name: "kagent" -> "2"
# Redo that call and update these if the mlflow-mlflow PVC is ever wiped.
#
# Reuses the open-telemetry HelmRepository releases/opentelemetry-demo.yaml
# already declares in flux-system rather than redeclaring it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: mlflow
spec:
  interval: 1h
  releaseName: otel-collector
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.173.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    mode: deployment
    fullnameOverride: otel-collector
    # The chart dropped its implicit image default in this version -- must be
    # explicit or the render fails outright.
    image:
      repository: otel/opentelemetry-collector-contrib
    # Jaeger/Zipkin ingestion ports are chart defaults, enabled regardless of
    # whether those receivers exist in config. Disabled to match the trimmed
    # receiver set below instead of listening on dead ports.
    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    config:
      connectors:
        # No match_once/default_pipelines -- see the file header comment for
        # why there's deliberately no catch-all bucket here.
        routing:
          table:
            - statement: route() where resource.attributes["k8s.namespace.name"] == "otel-demo"
              pipelines: [traces/otel-demo]
            - statement: route() where resource.attributes["k8s.namespace.name"] == "kagent"
              pipelines: [traces/kagent]
      exporters:
        # otlp_http, not otlphttp -- the chart's rewriteDeprecatedComponentNames
        # (on by default) silently renames the old identifier at render time;
        # writing the current one directly skips that rewrite and its warning.
        otlp_http/mlflow-otel-demo:
          endpoint: http://mlflow-mlflow.mlflow.svc.cluster.local:5000
          tls:
            insecure: true
          headers:
            x-mlflow-experiment-id: "1"
        otlp_http/mlflow-kagent:
          endpoint: http://mlflow-mlflow.mlflow.svc.cluster.local:5000
          tls:
            insecure: true
          headers:
            x-mlflow-experiment-id: "2"
        # Phoenix receives OTLP/gRPC on :6006 (collector port, not the web UI).
        # Parallel export: same spans go to both MLflow and Phoenix so the two
        # UIs can be compared side by side without switching kagent's endpoint.
        otlp/phoenix:
          endpoint: phoenix-svc.phoenix.svc.cluster.local:6006
          tls:
            insecure: true
      # jaeger/zipkin removed outright, not just dropped from the traces
      # pipeline below -- the collector refuses to start with a receiver
      # defined but not referenced by any pipeline.
      receivers:
        jaeger: null
        zipkin: null
      service:
        pipelines:
          traces:
            receivers:
              - otlp
            exporters:
              # debug logs every received span once, pre-routing, to the
              # pod's stdout -- useful to confirm traces are arriving at all
              # before checking which experiment they landed in.
              - debug
              - routing
          traces/otel-demo:
            receivers:
              - routing
            exporters:
              - otlp_http/mlflow-otel-demo
              - otlp/phoenix
          traces/kagent:
            receivers:
              - routing
            exporters:
              - otlp_http/mlflow-kagent
              - otlp/phoenix
