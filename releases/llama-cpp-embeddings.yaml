apiVersion: v1
kind: Namespace
metadata:
  name: llama-cpp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      containers:
        - name: llama-cpp
          image: ghcr.io/den-vasyliev/abox/nomic-embed:v1.18.1-4ccc0ff
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-embeddings
  namespace: llama-cpp
spec:
  selector:
    app: llama-cpp
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp
  namespace: llama-cpp
spec:
  parentRefs:
    - name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llamacpp
      backendRefs:
        - name: llama-cpp-embeddings
          port: 8090
