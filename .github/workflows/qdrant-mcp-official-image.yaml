# Builds mcp/qdrant-mcp-official and pushes it to GHCR.
# Wraps the official qdrant/mcp-server-qdrant Python package in a container
# so it can run as a kagent MCPServer with stdio transport.
name: Build qdrant-mcp-official image

on:
  push:
    branches: [main, lab04]
    paths:
      - 'mcp/qdrant-mcp-official/**'
      - '.github/workflows/qdrant-mcp-official-image.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/qdrant-mcp-official

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: mcp/qdrant-mcp-official
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### qdrant-mcp-official image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:0.1.0" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
